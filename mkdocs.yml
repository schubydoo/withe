site_name: Withe
site_description: A dashboard for the Renovate you already run. Read-only, self-hosted, non-invasive.
site_url: https://schubydoo.github.io/withe/
site_author: schubydoo
copyright: MIT

repo_url: https://github.com/schubydoo/withe
repo_name: schubydoo/withe
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  logo: assets/mark-white.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.top
    - navigation.sections
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

extra:
  version:
    # The version selector is driven by mike (see .github/workflows/docs.yml).
    provider: mike
    default: latest

nav:
  - Home: index.md
  - Installation: installation.md
  - Configuration: configuration.md
  - Exposure & TLS: exposure.md
  - Storage & export: storage.md
  - Performance: performance.md
  # Governance docs stay canonical on GitHub.
  - Contributing: https://github.com/schubydoo/withe/blob/main/CONTRIBUTING.md
  - Security: https://github.com/schubydoo/withe/blob/main/SECURITY.md
