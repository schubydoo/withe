name: Prepare Release

# knope's "release PR" half. On push to main, if a `.changeset/*.md` fragment is
# pending, knope bumps the version + CHANGELOG, resyncs package-lock.json,
# force-pushes the `release` branch, and opens/refreshes a `chore: prepare
# release X.Y.Z` PR. Merging that PR is the approval gate; the merge triggers
# knope-release.yml.
#
# GATED OFF behind the `KNOPE_ENABLED` repo variable until proven. Needs a
# WITHE_RELEASE_TOKEN secret — a fine-grained PAT with contents:write and
# pull-requests:write. A PAT (not GITHUB_TOKEN) is used so the tag the release
# half later pushes triggers release.yml; GitHub suppresses that for GITHUB_TOKEN.
#
# Built locally 2026-08-14, not yet pushed.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: knope-prepare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    if: ${{ vars.KNOPE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Detect a pending changeset first, credential-less, so a routine push with
      # no fragment is a clean no-op.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect pending changesets
        id: changesets
        run: |
          set -euo pipefail
          count=0
          if [ -d .changeset ]; then
            count=$(find .changeset -maxdepth 1 -name '*.md' ! -iname 'README.md' | wc -l)
          fi
          echo "has=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "pending changeset fragments: $count"
      # Re-checkout with the PAT persisted so knope's git push + PR run as it, and
      # so the release half's tag can trigger release.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.changesets.outputs.has == 'true' }}
        with:
          fetch-depth: 0
          token: ${{ secrets.WITHE_RELEASE_TOKEN }}
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ steps.changesets.outputs.has == 'true' }}
        with:
          node-version: "24"
      - name: Configure git identity
        if: ${{ steps.changesets.outputs.has == 'true' }}
        run: |
          git config user.name "Schuby"
          git config user.email "12485317+schubydoo@users.noreply.github.com"
      - name: Install knope
        if: ${{ steps.changesets.outputs.has == 'true' }}
        uses: knope-dev/action@19617851f9f13ab2f27a05989c55efb18aca3675 # v2.1.2
        with:
          version: 0.23.0
      - name: Open or refresh the release PR
        if: ${{ steps.changesets.outputs.has == 'true' }}
        run: knope prepare-release --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.WITHE_RELEASE_TOKEN }}
