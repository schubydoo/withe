name: Prepare Release

# knope's "release PR" half. On push to main, if a `.changeset/*.md` fragment is
# pending, knope bumps the version + CHANGELOG, resyncs package-lock.json,
# force-pushes the `release` branch, and opens/refreshes a `chore: prepare
# release X.Y.Z` PR. Merging that PR is the approval gate; the merge triggers
# knope-release.yml.
#
# GATED OFF behind the `KNOPE_ENABLED` repo variable until proven. Needs the
# `withe-ci` GitHub App installed on the repo (WITHE_CI_APP_ID /
# WITHE_CI_APP_PRIVATE_KEY secrets). A short-lived App token — not GITHUB_TOKEN —
# is used so the tag the release half later pushes triggers release.yml; GitHub
# suppresses that recursion for GITHUB_TOKEN. Only a release-driving push (a
# pending changeset) mints the token; a routine push is a credential-less no-op.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: knope-prepare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    if: ${{ vars.KNOPE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Detect a pending changeset first, credential-less, so a routine push with
      # no fragment is a clean no-op that never touches the withe-ci App.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect pending changesets
        id: changesets
        run: |
          set -euo pipefail
          count=0
          if [ -d .changeset ]; then
            count=$(find .changeset -maxdepth 1 -name '*.md' ! -iname 'README.md' | wc -l)
          fi
          echo "has=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "pending changeset fragments: $count"
      # Short-lived withe-ci App token, minted only when a fragment is pending. Its
      # identity is what lets the release PR's eventual merge tag trigger
      # release.yml and lets CI run on the release PR. (Later: the
      # WITHE_CI_CLIENT_ID secret can replace app-id once app-id is deprecated.)
      - name: Mint withe-ci App token
        id: app-token
        if: ${{ steps.changesets.outputs.has == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.WITHE_CI_APP_ID }}
          private-key: ${{ secrets.WITHE_CI_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Verify App token was minted
        if: ${{ steps.changesets.outputs.has == 'true' && steps.app-token.outputs.token == '' }}
        run: |
          echo "::error::withe-ci App token mint produced an empty token; check the WITHE_CI_APP_ID / WITHE_CI_APP_PRIVATE_KEY secrets and the App installation."
          exit 1
      # Re-checkout with the App token persisted so knope's git push of the release
      # branch + the PR it opens run as the App identity. Full history + tags so
      # knope can find the last release tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.changesets.outputs.has == 'true' }}
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ steps.changesets.outputs.has == 'true' }}
        with:
          node-version: "24"
      - name: Configure git identity (withe-ci App)
        if: ${{ steps.changesets.outputs.has == 'true' }}
        run: |
          git config user.name "withe-ci[bot]"
          git config user.email "withe-ci[bot]@users.noreply.github.com"
      - name: Install knope
        if: ${{ steps.changesets.outputs.has == 'true' }}
        uses: knope-dev/action@19617851f9f13ab2f27a05989c55efb18aca3675 # v2.1.2
        with:
          version: 0.23.0
      - name: Open or refresh the release PR
        if: ${{ steps.changesets.outputs.has == 'true' }}
        run: knope prepare-release --verbose
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
