name: Changeset check

# Advisory, NON-BLOCKING safety net for the changesets-only release model. Withe
# releases are driven entirely by `.changeset/*.md` fragments (knope.toml,
# ignore_conventional_commits) — a user-facing change with no fragment ships with
# no changelog entry AND no version bump. This check nudges (a sticky PR comment +
# a warning annotation) when a PR touches src/ without a changeset. It is NOT a
# required check and never fails the job, so it can't block a merge; it only
# reminds. Opt out per-PR with the `no-changelog` label (CI / refactor / tests).
# Gated on KNOPE_ENABLED with the rest of the release flow.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write # post/update the advisory sticky comment

concurrency:
  group: changeset-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changeset:
    # Same-repo PRs only (fork PRs get a read-only token and can't comment), never
    # on knope's own release PR (it deletes changesets as it prepares), and only
    # once the changesets flow is enabled.
    if: >-
      ${{ vars.KNOPE_ENABLED == 'true'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.head_ref != 'release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Optional withe-ci App token for a larger API budget (>=5,000 REST req/hr vs
      # the 1,000/hr github-actions[bot] pool); soft-fail so a missing/rotated App
      # degrades to GITHUB_TOKEN rather than redding an advisory check. This job
      # requests only contents:read + pull-requests:write, both of which the App
      # already grants, so the mint succeeds without the Issues permission.
      - name: Mint withe-ci App token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.WITHE_CI_CLIENT_ID }}
          private-key: ${{ secrets.WITHE_CI_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const marker = '<!-- changeset-check -->';
            const done = `${marker}\n✅ Changeset present, opted out, or no \`src/\` change — thanks!`;
            try {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner, repo, pull_number: pr.number, per_page: 100,
              });
              const hasChangeset = files.some(f => /^\.changeset\/.+\.md$/.test(f.filename));
              const touchesSrc = files.some(f => f.filename.startsWith('src/'));

              // Look the sticky up before the opt-out check, so applying the
              // no-changelog label (a `labeled` trigger) can clear a warning that
              // was already posted rather than leave it up to contradict the label.
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: pr.number, per_page: 100,
              });
              const existing = comments.find(c => (c.body || '').includes(marker));

              const optedOut = (pr.labels || []).map(l => l.name).includes('no-changelog');

              if (optedOut || !touchesSrc || hasChangeset) {
                // Nothing to warn about. Clear any stale warning by flipping the
                // sticky to the done body, but only when it would actually change
                // it — otherwise every synchronize rewrites a byte-identical comment.
                if (existing && existing.body !== done) {
                  await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: done });
                }
                if (optedOut) core.info('no-changelog label set; no changeset required.');
                return;
              }

              const body = [
                marker,
                '⚠️ **No changeset found.** This PR changes `src/` but adds no `.changeset/*.md` fragment.',
                '',
                'Withe releases are changesets-only: a user-facing change needs a fragment, or it ships with',
                '**no changelog entry and no version bump**. Add one — run `knope document-change`, or commit a',
                '`.changeset/<slug>.md` with front-matter `default: patch|minor|major|perf|security`',
                'and a one-line summary (see the changeset section in `CONTRIBUTING.md`). Internal-only PRs',
                '(CI, refactor, tests) can add the **`no-changelog`** label instead.',
                '',
                '_Advisory only — this check never blocks the merge._',
              ].join('\n');
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
              }
              core.warning('PR changes src/ without a changeset — add one or apply the no-changelog label.');
            } catch (err) {
              // Advisory check: never fail the job on a comment/API hiccup.
              core.warning(`changeset check skipped: ${err.message}`);
            }
