name: Scorecard

# OpenSSF Scorecard — scores the repo's security posture (branch protection,
# pinned deps, token permissions, review) and uploads SARIF to code scanning,
# and publishes to the public OSSF report. Default branch only; the action
# hard-fails on a tag ref, so there is no release trigger.
#
# The Branch-Protection check needs administration:read, which GITHUB_TOKEN
# lacks. A short-lived `withe-ci` App token supplies it (and lifts the API
# budget to >=5,000/hr). Soft-fail: if the App secrets are absent the mint yields
# an empty token and Scorecard falls back to GITHUB_TOKEN (Branch-Protection
# stays inconclusive) rather than failing the run. Requires the App to be granted
# `administration: read`. publish_results needs a PUBLIC repo.

on:
  branch_protection_rule:
  schedule:
    - cron: "18 7 * * 1"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: OSSF Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # withe-ci App token as Scorecard's repo_token: the Branch-Protection check
      # needs administration:read (GITHUB_TOKEN can't read branch rules). Soft-fail
      # to GITHUB_TOKEN so a missing App secret leaves that one check inconclusive
      # rather than failing the whole run.
      - name: Mint withe-ci App token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.WITHE_CI_APP_ID }}
          private-key: ${{ secrets.WITHE_CI_APP_PRIVATE_KEY }}
          permission-administration: read
          permission-contents: read
      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          repo_token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: results.sarif
          category: scorecard
