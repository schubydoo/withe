name: Security

# The PR-gating security scanners, one job each so they run in parallel, appear
# individually in the checks list, and feed a single aggregator. Adapted from
# schubydoo/claustodian for a TS/Node repo that also ships a container image.
#
# The gitleaks and zizmor jobs mint a short-lived `withe-ci` App token so their
# GitHub API calls draw on the App's >=5,000/hr budget instead of the 1,000/hr
# github-actions[bot] pool; same-repo runs only (fork PRs can't read the App
# secrets), soft-fail to GITHUB_TOKEN. CodeQL, Trivy, and the SARIF uploads keep
# GITHUB_TOKEN — github/codeql-action/upload-sarif rejects App installation
# tokens.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "37 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: codeql analyze
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: "/language:javascript-typescript"

  gitleaks:
    name: secret scan
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # withe-ci App token (>=5,000 REST req/hr) so the action's API calls don't
      # exhaust the 1,000/hr github-actions[bot] pool. Same-repo only; fork PRs
      # skip the mint (soft-fail) and fall back to GITHUB_TOKEN below.
      - name: Mint withe-ci App token
        id: app-token
        if: >-
          ${{ github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository }}
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.WITHE_CI_APP_ID }}
          private-key: ${{ secrets.WITHE_CI_APP_PRIVATE_KEY }}
          permission-contents: read
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

  zizmor:
    name: workflow audit
    if: >-
      github.event_name != 'pull_request'
      || (github.event.action != 'synchronize' && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # withe-ci App token so zizmor's advisory API lookups don't 403 against the
      # 1,000/hr github-actions[bot] pool. Same-repo only; fork PRs fall back.
      - name: Mint withe-ci App token
        id: app-token
        if: >-
          ${{ github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository }}
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.WITHE_CI_APP_ID }}
          private-key: ${{ secrets.WITHE_CI_APP_PRIVATE_KEY }}
          permission-contents: read
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install zizmor
        run: uv tool install zizmor
      - name: Run zizmor
        run: zizmor --format sarif . > results.sarif
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: results.sarif
          category: zizmor

  trivy:
    name: trivy (deps + Dockerfile)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A filesystem scan reads the resolved lockfile for dependency CVEs and the
      # Dockerfile for misconfiguration — no image build needed. Base-image CVEs
      # are caught by the digest pin plus Renovate rather than a per-PR image scan.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          exit-code: "0" # report-only; the SARIF surfaces findings in code scanning
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: trivy.sarif
          category: trivy

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  security-required-checks-passed:
    name: security required checks passed
    if: always()
    needs: [codeql, gitleaks, zizmor, trivy, dependency-review]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check required jobs passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          failing=$(echo "$NEEDS_JSON" | jq -r '
            to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | "\(.key): \(.value.result)"
          ')
          if [ -n "$failing" ]; then
            echo "Failed or cancelled jobs:"
            echo "$failing"
            exit 1
          fi
          echo "All required jobs passed (or were intentionally skipped)."
