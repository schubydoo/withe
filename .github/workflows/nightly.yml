name: Nightly

# Build a signed multi-arch image from `main` every night and push it to GHCR as
# a rolling `nightly` tag plus a dated `nightly-YYYYMMDD` tag, so unreleased
# changes on main can be dogfooded without cutting a real release. It carries the
# same supply-chain posture as a release — cosign-signed, with registry SLSA
# provenance and SBOM attestations — but publishes NO GitHub Release and never
# touches `latest`: those belong to the stable `v*` flow (release.yml).
#
# A scheduled run is a no-op when main has not moved in the last day, so an
# unchanged tree is not rebuilt and re-tagged for nothing. A manual dispatch
# always builds. Disable the schedule by disabling this workflow in Actions.
#
# Action refs are pinned to full commit SHAs (Actions policy + Scorecard
# Pinned-Dependencies); Renovate keeps them current, alongside release.yml.

on:
  schedule:
    - cron: "13 3 * * *" # 03:13 UTC daily — off the top of the hour (repo convention;
    # the on-the-hour slot is the most contended on GitHub's scheduler) and clear
    # of the other crons (security 04:37, osv 05:27, client 06:17, scorecard 07:18).
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  # Decide whether to build: main only, and only when its HEAD differs from the
  # commit the last successful nightly published. Comparing commits rather than a
  # wall-clock window means a scheduled run delayed behind GitHub's queue cannot
  # silently drop a night. A manual dispatch always builds (but still main only).
  changed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # gh run list, to read the last nightly's commit
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # workflow_dispatch can select any branch; building it would push that
          # branch to the rolling `nightly` tag. Nightly is main only.
          if [ "$REF" != "main" ]; then
            echo "::error::Nightly builds main only; refusing ref '$REF'."
            exit 1
          fi
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "::notice::manual dispatch — building the nightly."
            exit 0
          fi
          # The last successful nightly's commit; empty on the first ever run.
          last=$(gh run list --workflow=nightly.yml --branch main --status success \
                   --limit 1 --json headSha --jq '.[0].headSha // ""')
          if [ "$last" = "$HEAD_SHA" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main is at $HEAD_SHA, already the last nightly — skipping."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  image:
    needs: changed
    if: ${{ needs.changed.outputs.build == 'true' }}
    name: build, sign, SBOM + provenance → GHCR (nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 45 # the arm64 leg builds under QEMU emulation
    permissions:
      contents: read
      packages: write # push to ghcr.io/<owner>/withe
      id-token: write # keyless cosign (Fulcio OIDC) + attest-build-provenance
      attestations: write # actions/attest-build-provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # A rolling `nightly` and a dated `nightly-YYYYMMDD` to pin one night.
          # Never `latest` — that is the stable release's tag, not a build off
          # unreleased main. The dated tag records the commit through the OCI
          # `revision` label, so a separate `sha-` tag would only duplicate it.
          # The `changed` gate builds only when main actually moves, so dated tags
          # accrue at the rate of change, not one a night; set a retention policy
          # on the GHCR package (keep the most recent N `nightly-*`) if they pile up.
          tags: |
            type=raw,value=nightly
            type=raw,value=nightly-{{date 'YYYYMMDD'}}
          flavor: |
            latest=false

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true # SLSA provenance attestation in the registry
          sbom: true # SBOM attestation in the registry

      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${{ github.repository }}@${DIGEST}"

      - name: SLSA build provenance (image)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: false
