name: Nightly

# Build a signed multi-arch image from `main` every night and push it to GHCR as
# a rolling `nightly` tag plus a dated `nightly-YYYYMMDD` tag, so unreleased
# changes on main can be dogfooded without cutting a real release. It carries the
# same supply-chain posture as a release — cosign-signed, with registry SLSA
# provenance and SBOM attestations — but publishes NO GitHub Release and never
# touches `latest`: those belong to the stable `v*` flow (release.yml).
#
# A scheduled run is a no-op when main has not moved since the last nightly, or
# when every file that changed is outside the image (CI, docs, tests, release
# notes). Then an unchanged image is not rebuilt and re-tagged for nothing. A
# manual dispatch always builds. Disable the schedule by disabling this workflow
# in Actions.
#
# Action refs are pinned to full commit SHAs (Actions policy + Scorecard
# Pinned-Dependencies); Renovate keeps them current, alongside release.yml.

on:
  schedule:
    - cron: "13 3 * * *" # 03:13 UTC daily — off the top of the hour (repo convention;
    # the on-the-hour slot is the most contended on GitHub's scheduler) and clear
    # of the other crons (security 04:37, osv 05:27, client 06:17, scorecard 07:18).
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  # Decide whether to build: main only, and only when its HEAD differs from the
  # commit the last successful nightly published. Comparing commits rather than a
  # wall-clock window means a scheduled run delayed behind GitHub's queue cannot
  # silently drop a night. A manual dispatch always builds (but still main only).
  #
  # When main moved, the files changed since that commit decide. NOT_IMAGE lists
  # the paths that cannot change the image; any other path builds. The list is a
  # denylist on purpose: a new file that nobody classified builds, so the error
  # case is one extra build, never a stale nightly. package.json and
  # package-lock.json always build, because the build tools (next, typescript,
  # tailwindcss, esbuild) are devDependencies. This workflow file also builds, so
  # a change to it is proved on the next night.
  #
  # One exception to "cannot change": Tailwind scans the whole build context for
  # class names, so a word in docs/, test/ or .github/ can add or remove a CSS
  # rule. No page uses such a rule, because every class the app uses is in src/,
  # and src/ builds. A skip can leave unused CSS in the nightly, nothing more.
  #
  # A skipped run is a successful run, so the next night compares against the
  # skipped commit. That is correct: nothing between the last build and the
  # skipped commit touched the image.
  changed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # gh run list, to read the last nightly's commit
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      # Full history for `git diff` against the last nightly's commit. Trees only:
      # a file list needs no file contents.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      - id: check
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NOT_IMAGE: >-
            ^(\.github/|docs/|test/|tools/|\.changeset/|assets/)|^src/.*\.test\.tsx?$|^[^/]+\.md$|^(mkdocs\.yml|renovate\.json|codecov\.yml|\.gitleaks\.toml|\.pre-commit-config\.yaml|playwright\.config\.ts|knope\.toml|\.bestpractices\.json|\.worktreeinclude|LICENSE)$
        run: |
          set -euo pipefail
          # workflow_dispatch can select any branch; building it would push that
          # branch to the rolling `nightly` tag. Nightly is main only.
          if [ "$REF" != "main" ]; then
            echo "::error::Nightly builds main only; refusing ref '$REF'."
            exit 1
          fi
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "::notice::manual dispatch — building the nightly."
            exit 0
          fi
          # The last successful nightly's commit; empty on the first ever run.
          last=$(gh run list --workflow=nightly.yml --branch main --status success \
                   --limit 1 --json headSha --jq '.[0].headSha // ""')
          if [ -z "$last" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$last" = "$HEAD_SHA" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main is at $HEAD_SHA, already the last nightly — skipping."
            exit 0
          fi
          # A failed diff (the old commit is gone after a history rewrite) builds.
          # --no-renames lists both paths of a move, so a file moved out of the
          # image into a skipped path still builds. It also keeps the diff to
          # trees, which the blob:none clone has.
          if ! files=$(git diff --no-renames --name-only "$last" "$HEAD_SHA"); then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "::warning::cannot diff $last..$HEAD_SHA — building."
            exit 0
          fi
          image=$(printf '%s\n' "$files" | grep -Ev "$NOT_IMAGE" | grep -v '^$' || true)
          # NOT_IMAGE skips all of .github/, but a change to this file builds.
          if printf '%s\n' "$files" | grep -qx '\.github/workflows/nightly\.yml'; then
            image=$(printf '%s\n%s' "$image" ".github/workflows/nightly.yml" | grep -v '^$')
          fi
          if [ -n "$image" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "::notice::image files changed since $last: $(printf '%s' "$image" | head -n 10 | paste -sd ' ' -)"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::only non-image files changed since $last — skipping."
          fi

  image:
    needs: changed
    if: ${{ needs.changed.outputs.build == 'true' }}
    name: build, sign, SBOM + provenance → GHCR (nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 45 # the arm64 leg builds under QEMU emulation
    permissions:
      contents: read
      packages: write # push to ghcr.io/<owner>/withe
      id-token: write # keyless cosign (Fulcio OIDC) + attest-build-provenance
      attestations: write # actions/attest-build-provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Install cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # A rolling `nightly` and a dated `nightly-YYYYMMDD` to pin one night.
          # Never `latest` — that is the stable release's tag, not a build off
          # unreleased main. The dated tag records the commit through the OCI
          # `revision` label, so a separate `sha-` tag would only duplicate it.
          # The `changed` gate builds only when a change on main touches the image, so dated tags
          # accrue at the rate of change, not one a night; set a retention policy
          # on the GHCR package (keep the most recent N `nightly-*`) if they pile up.
          tags: |
            type=raw,value=nightly
            type=raw,value=nightly-{{date 'YYYYMMDD'}}
          flavor: |
            latest=false

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true # SLSA provenance attestation in the registry
          sbom: true # SBOM attestation in the registry

      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${{ github.repository }}@${DIGEST}"

      - name: SLSA build provenance (image)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: false
