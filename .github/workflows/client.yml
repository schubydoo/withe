name: CE client

# Keep the generated Renovate CE client in step with the upstream OpenAPI spec.
# Runs daily: fetches openapi-community.yaml from mend/renovate-ce-ee (the repo
# that holds the spec — NOT renovatebot/renovate), regenerates the typed client,
# and opens a pull request when anything changed. CI's own "generated client is
# in step with the spec" check is what fails a PR that drifts locally; this is
# what surfaces upstream drift instead of a user's bug report.
#
# Built locally 2026-08-14 (Task 3.11), not yet pushed.

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC — off the top of the hour
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ce-client
  cancel-in-progress: false

jobs:
  regenerate:
    name: fetch spec and regenerate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the update branch
      pull-requests: write # open the PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install
        run: npm ci

      - name: Fetch the upstream spec
        run: npm run spec:fetch

      - name: Regenerate the client
        run: npm run build:client

      - name: Open a pull request if anything changed
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: ce-client-update
          commit-message: "chore: regenerate the CE client from the upstream spec"
          title: "chore: regenerate the CE client from the upstream spec"
          body: |
            The Renovate CE OpenAPI spec in `mend/renovate-ce-ee` changed. This
            regenerates `src/adapters/ce/generated` and the committed
            `spec/openapi-community.yaml` to match.

            Review the diff for a breaking change to a field Withe reads before
            merging — a new or renamed enum value has bitten this project before.
          labels: dependencies
          add-paths: |
            spec/openapi-community.yaml
            src/adapters/ce/generated
