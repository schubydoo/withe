name: E2E

# End-to-end tests against a stub CE — no live CE, no network beyond localhost.
# Two suites: the agent-browser flows (`npm run e2e`, the four operator flows
# plus a WCAG 2.1 AA audit, Chromium) and the Playwright cross-browser smoke
# (`npm run e2e:browsers`, chromium/firefox/webkit for NFR-17).

on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review is needed so marking a draft ready re-runs the job that
    # the draft guard below skipped.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: stub-backed flows + cross-browser smoke
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # The backstop, kept above the sum of the two browser-install step caps below
    # (8 + 18) plus the ~5-minute preamble, so on a single slow install the named
    # step cap fires first with the culprit in its name, not this generic timeout.
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Steer apt off the slow mirror and cap retries
        run: |
          # The two `--with-deps` installs below run `apt-get update`. The runner's
          # priority:1 mirror, azure.archive.ubuntu.com, has unreliable throughput:
          # a reachable-but-throttled azure (measured ~145 kB/s — a 61 MB font
          # package took 7 minutes) timed the browser installs out at their step
          # caps. A cheap probe cannot see throughput, so drop azure unconditionally
          # and let apt use archive.ubuntu.com, the mirror the healthy runs finished
          # on. Steady beats fast-but-flaky.
          if grep -qs azure.archive.ubuntu.com /etc/apt/apt-mirrors.txt; then
            sudo sed -i '\#azure.archive.ubuntu.com#d' /etc/apt/apt-mirrors.txt
            echo "dropped the azure mirror"
          else
            # No azure entry to drop: the image renamed the mirror or moved to
            # deb822. Warn rather than claim a mitigation that did not run — a
            # silent no-op would return as the 8-minute install timeout.
            echo "::warning::no azure entry in /etc/apt/apt-mirrors.txt — mirror hardening skipped"
          fi
          # Retries 2 (down from apt's default 3) with short timeouts: a dead mirror
          # fails over in well under a minute, while a spare attempt still covers a
          # transient 5xx or a truncated .deb during the WebKit/Firefox dep install.
          printf 'Acquire::Retries "2";\nAcquire::http::Timeout "15";\nAcquire::https::Timeout "15";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-fail-fast >/dev/null

      # agent-browser drives the functional flows and the a11y audit (Chromium).
      # It bundles Chromium, so lockfile-pinning it would pull the browser into
      # every CI job that runs `npm ci`; accept the version-pinned ad-hoc global
      # install here rather than bloat the whole matrix (zizmor: adhoc-packages).
      - name: Install agent-browser and its browser
        # Bound the two steps that have demonstrably hung, so a stall fails this
        # named step in minutes rather than burning the whole job timeout. This
        # step downloads Chromium and its deps too — measured 66.9 MB in 2m52s on
        # a cold runner — so it is not free; 8 minutes leaves margin over that.
        timeout-minutes: 8
        run: | # zizmor: ignore[adhoc-packages]
          npm i -g agent-browser@0.33.2
          agent-browser install --with-deps

      # Playwright drives the cross-browser smoke; --with-deps installs the
      # system libraries WebKit and Firefox need, which a bare runner lacks.
      - name: Install Playwright browsers
        # Higher than the agent-browser step: this one apt-fetches the WebKit and
        # Firefox system libraries and then the browser bundles. The 6-minute cap
        # it first hit was spent on the apt fetch alone, at a degraded ~300 kB/s
        # (109 MB in 6m04s) — the variable is mirror throughput, not package count.
        # 18 minutes covers a slow mirror; if this recurs, caching the browsers is
        # the durable fix. Under the job cap above, so this named step fires first.
        timeout-minutes: 18
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Flows and accessibility (agent-browser)
        run: npm run e2e

      - name: Cross-browser smoke (Playwright)
        run: npm run e2e:browsers

      - name: Upload Playwright report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 5
