name: Release

# On a v* tag: build the multi-arch container image, push it to GHCR with a SLSA
# provenance attestation and an SBOM attestation, sign it with keyless cosign,
# and attach a CycloneDX SBOM, a SLSA provenance `.intoto.jsonl`, and a
# cosign-signed checksums file to the GitHub Release (which knope-release created
# from the CHANGELOG). Fired by `git tag v1.0.0 && git push origin v1.0.0`, or by
# hand via workflow_dispatch against an existing tag.
#
# OpenSSF Scorecard: Signed-Releases — the cosign `.sigstore.json` signature plus
# the `*.intoto.jsonl` provenance among the release assets. SBOM — the CycloneDX
# asset. Registry-side: provenance + sbom attestations and a cosign image
# signature. TAD Task 3.5 (npm run check:image) still gates the image itself.
#
# Action refs are pinned to full commit SHAs (Actions policy + Scorecard
# Pinned-Dependencies); Renovate keeps them current.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v1.0.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Releases must not cancel each other — a half-pushed manifest is worse than
  # letting two runs serialize.
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: build, sign, SBOM + provenance → GHCR + Release
    runs-on: ubuntu-latest
    timeout-minutes: 45 # the arm64 leg builds under QEMU emulation
    permissions:
      contents: write # attach assets to the GitHub Release
      packages: write # push to ghcr.io/<owner>/withe
      id-token: write # keyless cosign (Fulcio OIDC) + attest-build-provenance
      attestations: write # actions/attest-build-provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install syft (SBOM)
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # v1.2.3 -> :1.2.3, :1.2, :latest. `latest` only from a stable release
          # tag, never a pre-release.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          flavor: |
            latest=auto

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true # SLSA provenance attestation in the registry
          sbom: true # SBOM attestation in the registry

      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${{ github.repository }}@${DIGEST}"

      - name: SLSA build provenance (image)
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: false

      - name: SBOM, checksums, and sign the release assets
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p release
          # CycloneDX SBOM of the pushed multi-arch image (syft reads it from GHCR
          # through the docker login above).
          syft "ghcr.io/${GITHUB_REPOSITORY}@${DIGEST}" \
            -o "cyclonedx-json=release/withe-${TAG}.sbom.cdx.json"
          # Give the provenance bundle a stable .intoto.jsonl name for Scorecard.
          [ -s "$BUNDLE" ] || { echo "no provenance bundle produced" >&2; exit 1; }
          cp "$BUNDLE" "release/withe-${TAG}.intoto.jsonl"
          # Checksums over the SBOM + provenance, signed with keyless cosign so a
          # verifier trusts each asset transitively through its hash.
          cd release
          sha256sum "withe-${TAG}.sbom.cdx.json" "withe-${TAG}.intoto.jsonl" > checksums.txt
          cosign sign-blob --bundle checksums.txt.sigstore.json checksums.txt --yes

      # Attach to the Release knope-release already created (with CHANGELOG notes);
      # create it if this is a manual / Knope-off tag. gh via the runner's built-in
      # CLI (zizmor superfluous-actions). GH_REPO resolves the repo without relying
      # on the checkout.
      - name: Publish assets to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          assets=(
            "release/withe-${TAG}.sbom.cdx.json"
            "release/withe-${TAG}.intoto.jsonl"
            release/checksums.txt
            release/checksums.txt.sigstore.json
          )
          # A hyphenated tag (v1.0.0-rc.1, -beta) is a pre-release: don't let it
          # become the repo's "Latest release".
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" --title "$TAG" --generate-notes $prerelease
          fi
