name: Release

# Build the container image for amd64 and arm64 and push it to GHCR on a v* tag.
# Fired by `git tag v1.0.0 && git push origin v1.0.0`, or by hand via
# workflow_dispatch against an existing tag.
#
# Built locally 2026-08-14 (Task 3.11), not yet pushed. The image itself, its
# size and its twelve-point behaviour check are Task 3.5 (npm run check:image).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v1.0.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Releases must not cancel each other — a half-pushed manifest is worse than
  # letting two runs serialize.
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: build amd64 + arm64 and push to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 45 # the arm64 leg builds under QEMU emulation
    permissions:
      contents: read
      packages: write # push to ghcr.io/<owner>/withe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # v1.2.3 -> :1.2.3, :1.2, :latest. `latest` only from a real release
          # tag, never a pre-release.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          flavor: |
            latest=auto

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
